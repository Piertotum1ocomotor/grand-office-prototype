<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление сайтом — Гранд-Офис</title><link rel="stylesheet" href="/style.css"><script defer src="/workspace.js"></script><script defer src="/office/admin.js"></script></head>
<body>
<main class="shell page">
  <nav class="breadcrumb"><a href="/">Гранд-Офис</a></nav>
  <h1>Управление сайтом</h1>
  <section class="section"><h2>Заказы и заявки</h2><p id="request-count" class="small"></p><div id="request-list"></div></section>
  <section class="section"><h2>Цены и остатки</h2><form class="panel" id="lookup"><label><span class="field-label">Название, артикул или ID</span><input class="field" name="q" required></label><button class="btn">Найти</button></form><div id="product-list" class="steps"></div></section>
  <section class="section project-demo">
    <form class="panel" id="links"><h2>Связь с поставщиком</h2>
      <label><span class="field-label">Поставщик</span><input class="field" name="supplier" placeholder="Например, expro" required></label>
      <label><span class="field-label">ID предложения поставщика</span><input class="field" name="offer" required></label>
      <label><span class="field-label">ID товара</span><input class="field" name="product" type="number" min="1" required></label>
      <label><span class="field-label">ID варианта</span><input class="field" name="variant" type="number" min="0" value="0" required></label>
      <label><span class="field-label">Коэффициент розничной цены</span><input class="field" name="multiplier" type="number" step="0.01" min="0.01" value="1" required></label>
      <button class="btn">Сохранить</button><p class="result" role="status" hidden></p>
    </form>
    <form class="panel" id="imports"><h2>Обновление поставщика</h2>
      <label><span class="field-label">Поставщик</span><input class="field" name="supplier" required value="expro"></label>
      <label><span class="field-label">CSV с колонками offer_id, price, stock</span><textarea class="field" rows="5" name="csv" placeholder="Для «Экспро» можно использовать настроенный XML"></textarea></label>
      <button class="btn" value="preview">Предпросмотр</button> <button class="btn secondary" value="apply" id="apply-import" disabled>Применить</button>
      <p class="result" role="status" hidden></p><ul id="import-preview"></ul>
    </form>
  </section>
  <section class="section"><h2>Журнал загрузок</h2><div id="journal"></div></section>
</main>
</body>
</html>
