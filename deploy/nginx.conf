# Пример фрагмента TLS-сервера Nginx для grand-office59.ru.
# Перед включением подставьте адрес действующего WordPress, доступный после смены DNS.
client_max_body_size 12m;

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Сохраняем существующие картинки и стили, страницы и личный кабинет WordPress.
location ~ ^/(?:wp-content/|wp-includes/|wp-admin/admin-ajax\.php$|wp-json/|privacy-policy/?$|my-account(?:/|$)|partneram(?:/|$)|partnerstvo/?$|gos-ucherezhdeniyam/?$|kabinet-rukovoditelya-swift/?$|kresla-i-stulya/?$|mebel-na-zakaz/?$|resheniya-po-otraslyam/?$|(?:page|product|product_cat)-sitemap[0-9]*\.xml$) {
    proxy_pass https://legacy-origin.example.invalid;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /sitemap_index.xml {
    return 301 /sitemap.xml;
}
